<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=640, height=480" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      /* Estética: ondas de seda, burbujas que suben y destellos suaves. */
      :root {
        --deep: #071f21;
        --deep-2: #12403e;
        --sage: #84c3a6;
        --mint: #c9f1e0;
        --rose: #f2b8cf;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 640px;
        height: 480px;
        overflow: hidden;
        background: var(--deep);
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
        overflow: hidden;
        background: radial-gradient(90% 90% at 50% 30%, var(--deep-2) 0%, var(--deep) 70%);
      }
      #glow {
        position: absolute;
        width: 300px;
        height: 300px;
        left: 170px;
        top: 70px;
        border-radius: 50%;
        background: var(--rose);
        filter: blur(90px);
        opacity: 0.22;
      }
      #art {
        position: absolute;
        inset: 0;
        width: 640px;
        height: 480px;
      }
      #bubbles {
        position: absolute;
        inset: 0;
      }
      .bubble {
        position: absolute;
        border-radius: 50%;
        background: radial-gradient(circle at 35% 30%, rgba(255, 255, 255, 0.55), rgba(201, 241, 224, 0.12) 55%, rgba(201, 241, 224, 0.04));
        border: 1px solid rgba(201, 241, 224, 0.35);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="6"
      data-fps="30"
      data-width="640"
      data-height="480"
    >
      <div id="glow" data-layout-allow-overflow="true"></div>
      <svg id="art" viewBox="0 0 640 480" aria-hidden="true">
        <defs>
          <linearGradient id="silk-a" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0%" stop-color="#84c3a6" stop-opacity="0" />
            <stop offset="50%" stop-color="#84c3a6" stop-opacity="0.55" />
            <stop offset="100%" stop-color="#f2b8cf" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="silk-b" x1="0" x2="1" y1="0" y2="0">
            <stop offset="0%" stop-color="#f2b8cf" stop-opacity="0" />
            <stop offset="50%" stop-color="#c9f1e0" stop-opacity="0.45" />
            <stop offset="100%" stop-color="#84c3a6" stop-opacity="0" />
          </linearGradient>
        </defs>
        <g id="silk" data-layout-allow-overflow="true">
          <path id="silk-1" d="M -40 330 C 120 250, 220 410, 360 320 S 560 250, 700 320" fill="none" stroke="url(#silk-a)" stroke-width="34" stroke-linecap="round" />
          <path id="silk-2" d="M -40 370 C 140 300, 260 440, 400 360 S 580 300, 700 360" fill="none" stroke="url(#silk-b)" stroke-width="18" stroke-linecap="round" />
        </g>
        <g id="sparkles" fill="#fff"></g>
      </svg>
      <div id="bubbles"></div>
    </div>
    <script>
      // Generador determinista: nada de Math.random.
      let seed = 4142;
      const rand = () => {
        seed = (seed * 1664525 + 1013904223) % 4294967296;
        return seed / 4294967296;
      };

      const bubbles = document.getElementById('bubbles');
      const items = [];
      for (let i = 0; i < 14; i++) {
        const b = document.createElement('span');
        const size = 14 + rand() * 34;
        b.className = 'bubble';
        b.id = 'bubble-' + i;
        b.style.width = size + 'px';
        b.style.height = size + 'px';
        b.style.left = (30 + rand() * 560).toFixed(0) + 'px';
        b.style.top = '0px';
        bubbles.appendChild(b);
        items.push({ el: b, start: rand() * 560 - 60 });
      }

      const ns = 'http://www.w3.org/2000/svg';
      const sparkles = document.getElementById('sparkles');
      const stars = [];
      for (let i = 0; i < 10; i++) {
        const s = document.createElementNS(ns, 'path');
        const x = 60 + rand() * 520;
        const y = 50 + rand() * 230;
        const r = 5 + rand() * 7;
        s.setAttribute('id', 'sparkle-' + i);
        s.setAttribute('d', `M ${x} ${y - r} Q ${x} ${y} ${x + r} ${y} Q ${x} ${y} ${x} ${y + r} Q ${x} ${y} ${x - r} ${y} Q ${x} ${y} ${x} ${y - r} Z`);
        sparkles.appendChild(s);
        stars.push(s);
      }

      const tl = gsap.timeline({ paused: true });

      // Burbujas que suben y reaparecen abajo: wrap mantiene el bucle exacto (función del valor, sin reloj).
      const wrapY = gsap.utils.wrap(-60, 520);
      items.forEach(({ el, start }) => {
        tl.fromTo(el, { y: start }, { y: start - 580, duration: 6, ease: 'none', modifiers: { y: (y) => wrapY(parseFloat(y)) + 'px' } }, 0);
      });

      // Destellos: periodos de 1, 1,5 y 3 s (cantidad par de medios ciclos en 6 s).
      stars.forEach((s, i) => {
        const d = [1, 1.5, 3][i % 3];
        tl.fromTo(s, { opacity: 0.1, scale: 0.6, transformOrigin: '50% 50%' }, { opacity: 0.95, scale: 1.15, duration: d, ease: 'sine.inOut', yoyo: true, repeat: 6 / d - 1 }, 0);
      });

      // Seda que ondula.
      tl.fromTo('#silk-1', { y: 0 }, { y: -26, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);
      tl.fromTo('#silk-2', { y: 0 }, { y: 22, duration: 1.5, ease: 'sine.inOut', yoyo: true, repeat: 3 }, 0);
      tl.fromTo('#glow', { scale: 1 }, { scale: 1.25, duration: 3, ease: 'sine.inOut', yoyo: true, repeat: 1 }, 0);

      window.__timelines['main'] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
